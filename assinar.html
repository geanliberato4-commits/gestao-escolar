<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Assinatura de contrato escolar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div class="pub"><div class="wrap">
  <div style="height:6px;background:var(--faixa);border-radius:99px;margin-bottom:16px"></div>
  <div class="top"><img id="logo" alt="" style="height:64px;max-width:200px;object-fit:contain;display:none">
    <div><h2 style="font-size:1.3rem" id="esc">Contrato escolar</h2><div class="muted small" id="sub">Carregando…</div></div></div>
  <div id="box"><div class="loading"><div class="spin"></div>Carregando contrato…</div></div>
</div></div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=1"></script>
<script>
const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: false } });
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icons = () => { try { lucide.createIcons(); } catch (_) {} };
const token = new URLSearchParams(location.search).get("t");

async function carregar() {
  if (!/^[0-9a-f-]{36}$/i.test(token || "")) return erro("Link inválido. Confira se copiou o endereço completo.");
  const { data, error } = await sb.rpc("contrato_publico", { p_token: token });
  if (error) return erro("Não foi possível abrir o contrato agora. Tente novamente em instantes.");
  if (data.erro) return erro(data.erro);
  $("#esc").textContent = data.escola; document.title = "Assinatura — " + data.escola;
  document.body.dataset.tema = /mef/i.test(data.logo || data.escola) ? "mef" : "estacao";
  if (data.logo) { $("#logo").src = data.logo; $("#logo").style.display = "block"; }
  $("#sub").textContent = `Aluno(a): ${data.aluno}`;
  if (data.status === "assinado") {
    $("#box").innerHTML = `<div class="msg ok"><i data-lucide="check-circle-2"></i><div><b>Contrato assinado</b> por ${esc(data.signatario)} em ${new Date(data.assinado_em).toLocaleString("pt-BR")}.<br>Código de verificação: <b>${esc(data.codigo)}</b>. Uma cópia fica arquivada na escola.</div></div>` +
      `<div class="doc-prev" style="max-height:none;margin-top:14px">${data.conteudo}</div>`;
    return icons();
  }
  $("#box").innerHTML = `<div class="msg warn"><i data-lucide="info"></i><div>Leia o contrato até o final. Para assinar, informe seu <b>nome completo</b>${data.exige_cpf ? ` e o <b>CPF</b> do responsável financeiro (termina em <b>${esc(data.cpf_final)}</b>)` : " e CPF"}.</div></div>
    <div class="doc-prev" style="max-height:none;margin-top:14px">${data.conteudo}</div>
    <div class="card" style="margin-top:16px" id="form">
      <h3>Assinar eletronicamente</h3><p class="sub">Responsável financeiro: ${esc(data.responsavel || "")}</p>
      <label>Nome completo</label><input id="nome" autocomplete="name" value="">
      <label>CPF</label><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14">
      <label>E-mail para registro (opcional)</label><input id="email" type="email" autocomplete="email">
      <label class="chk" style="margin-top:14px;align-items:flex-start"><input type="checkbox" id="aceite" style="margin-top:3px"> <span>Li e concordo com todos os termos deste contrato e reconheço esta assinatura eletrônica como válida (Lei 14.063/2020).</span></label>
      <div id="msg"></div>
      <button class="btn big" id="assinar" style="margin-top:14px"><i data-lucide="pen-line"></i>Assinar contrato</button>
      <p class="muted small" style="margin-top:12px">Ao assinar registramos data, hora, endereço IP, navegador e um código de integridade do documento. Seus dados são tratados conforme a LGPD.</p>
    </div>`;
  icons();
  $("#cpf").addEventListener("input", (e) => { let d = e.target.value.replace(/\D/g, "").slice(0, 11); e.target.value = d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2"); });
  $("#assinar").onclick = async () => {
    const b = $("#assinar"); b.disabled = true; $("#msg").innerHTML = "";
    const { data: r, error } = await sb.rpc("assinar_contrato", { p_token: token, p_nome: $("#nome").value, p_cpf: $("#cpf").value, p_email: $("#email").value, p_aceite: $("#aceite").checked, p_ua: navigator.userAgent });
    b.disabled = false;
    if (error || r?.erro) { $("#msg").innerHTML = `<div class="msg err"><i data-lucide="alert-circle"></i>${esc(r?.erro || "Falha ao assinar. Tente novamente.")}</div>`; return icons(); }
    window.scrollTo(0, 0); carregar();
  };
}
function erro(m) { $("#sub").textContent = ""; $("#box").innerHTML = `<div class="card"><div class="empty"><i data-lucide="link-2-off"></i>${esc(m)}</div></div>`; icons(); }
carregar();
</script>
</body>
</html>
